# Runs on every pull request and every push to main:
#   api     - lint, the integration tests against a real MySQL, dependency audit
#   web     - lint, production build
#   docker  - builds both images, starts the whole stack with docker compose
#             and runs scripts/smoke-test.sh against it
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · lint, test, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      # The tests create and drop their own database, erp_test.
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  web:
    name: Web · lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker · build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Write a throwaway .env
        run: |
          {
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -base64 48)"
          } > .env
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Seed demo logins
        run: docker compose run --rm api node scripts/seed.js
      - name: Smoke test through nginx
        env:
          SMOKE_EMAIL: admin@erp.com
          SMOKE_PASSWORD: Password@123
        run: scripts/smoke-test.sh http://localhost:8080
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
